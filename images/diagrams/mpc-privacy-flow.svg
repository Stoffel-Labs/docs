<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Private computation boundary</title>
<desc id="desc">Alice and Bob prepare a share for each MPC party. Parties hold only shares and exchange protocol messages. Private inputs and intermediate values remain shared. Only an explicitly authorized opened result or client-output shares leave the boundary.</desc>
<defs>
  <style>
  .bg { fill: #f7f7fa; }
  .header { fill: #2246d2; }
  .zone { fill: #ffffff; stroke: #7f8bb3; stroke-width: 2; stroke-dasharray: 8 7; }
  .card { fill: #ffffff; stroke: #b8bfd5; stroke-width: 2; }
  .private { fill: #fff4d6; stroke: #d89a16; stroke-width: 2; }
  .party { fill: #2246d2; stroke: #15319b; stroke-width: 2; }
  .output { fill: #e9f7f2; stroke: #16836d; stroke-width: 2; }
  .title { font: 700 28px Arial, sans-serif; fill: #ffffff; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #e9edff; }
  .zone-title { font: 700 17px Arial, sans-serif; fill: #111827; }
  .body { font: 600 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #4b5563; }
  .party-title { font: 700 15px Arial, sans-serif; fill: #ffffff; }
  .party-sub { font: 400 12px Arial, sans-serif; fill: #ffffff; }
  .label { font: 700 12px Arial, sans-serif; fill: #31416f; }
  .arrow { fill: none; stroke: #172554; stroke-width: 3; marker-end: url(#arrow); }
  .share-arrow { fill: none; stroke: #2246d2; stroke-width: 2.5; marker-end: url(#blue-arrow); }
</style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#172554"/></marker>
  <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2246d2"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="675" rx="0" class="bg"/>
<rect x="0" y="0" width="1200" height="92" rx="0" class="header"/>
<text x="52" y="42" class="title" text-anchor="start">Private computation boundary</text>
<text x="52" y="70" class="subtitle" text-anchor="start">Parties hold shares; only an explicitly authorized output leaves</text>
<rect x="52" y="126" width="244" height="464" rx="14" class="zone"/>
<text x="76" y="158" class="zone-title" text-anchor="start">Input owners</text>
<rect x="76" y="188" width="196" height="100" rx="14" class="private"/>
<text x="174" y="226" class="body" text-anchor="middle">Alice</text>
<text x="174" y="254" class="small" text-anchor="middle">private value x</text>
<rect x="76" y="330" width="196" height="100" rx="14" class="private"/>
<text x="174" y="368" class="body" text-anchor="middle">Bob</text>
<text x="174" y="396" class="small" text-anchor="middle">private value y</text>
<text x="174" y="482" class="body" text-anchor="middle">Prepare one share</text>
<text x="174" y="506" class="small" text-anchor="middle">for each MPC party</text>
<rect x="354" y="126" width="522" height="464" rx="14" class="zone"/>
<text x="378" y="158" class="zone-title" text-anchor="start">Private-computation boundary</text>
<rect x="392" y="180" width="446" height="46" rx="14" class="card"/>
<text x="615" y="209" class="label" text-anchor="middle">Each party receives its indexed shares — never complete x or y</text>
<rect x="392" y="250" width="138" height="116" rx="14" class="party"/>
<text x="461" y="287" class="party-title" text-anchor="middle">Party 1</text>
<text x="461" y="314" class="party-sub" text-anchor="middle">holds x₁, y₁</text>
<text x="461" y="339" class="party-sub" text-anchor="middle">computes on shares</text>
<rect x="546" y="250" width="138" height="116" rx="14" class="party"/>
<text x="615" y="287" class="party-title" text-anchor="middle">Party 2</text>
<text x="615" y="314" class="party-sub" text-anchor="middle">holds x₂, y₂</text>
<text x="615" y="339" class="party-sub" text-anchor="middle">computes on shares</text>
<rect x="700" y="250" width="138" height="116" rx="14" class="party"/>
<text x="769" y="287" class="party-title" text-anchor="middle">Party n</text>
<text x="769" y="314" class="party-sub" text-anchor="middle">holds xₙ, yₙ</text>
<text x="769" y="339" class="party-sub" text-anchor="middle">computes on shares</text>
<text x="615" y="394" class="body" text-anchor="middle">Party-to-party protocol messages</text>
<path d="M460 406 C510 458, 565 458, 615 406" class="share-arrow"/>
<path d="M615 406 C665 458, 720 458, 770 406" class="share-arrow"/>
<rect x="392" y="468" width="446" height="82" rx="14" class="card"/>
<text x="615" y="500" class="body" text-anchor="middle">Private inputs and intermediate values stay shared</text>
<text x="615" y="528" class="small" text-anchor="middle">They are not reconstructed as outputs</text>
<rect x="934" y="208" width="214" height="194" rx="14" class="output"/>
<text x="1041" y="245" class="zone-title" text-anchor="middle">Authorized recipient</text>
<text x="1041" y="282" class="body" text-anchor="middle">explicit opening</text>
<text x="1041" y="307" class="body" text-anchor="middle">or client-output shares</text>
<text x="1041" y="349" class="small" text-anchor="middle">Only the declared</text>
<text x="1041" y="372" class="small" text-anchor="middle">output crosses the boundary</text>
<path d="M876 292 L922 292" class="arrow"/>
<text x="899" y="274" class="label" text-anchor="middle">authorized output</text>
<path d="M296 238 L380 200" class="arrow"/>
<path d="M296 380 L380 214" class="arrow"/>
<text x="332" y="207" class="label" text-anchor="middle">share sets</text>
<text x="329" y="323" class="label" text-anchor="middle">share sets</text>
</svg>
